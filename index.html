<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Runner</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
  }

  canvas {
    display: block;
  }
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ===== IMAGE PLAYER =====
const playerImg = new Image();
playerImg.src = "player.png";

// ===== GAME STATE =====
let gameStarted = false;
let gameOver = false;
let score = 0;
let level = 1;
let worldOffset = 0;

// ===== PLAYER =====
const player = {
  x: 150,
  y: canvas.height - 200,
  velocityY: 0,
  speed: 7,
  jumping: false
};

// ===== WORLD =====
const ground = canvas.height - 120;

// ===== ROCK =====
const rock = {
  x: 0,
  y: canvas.height - 150,
  radius: 55
};

// ===== OBSTACLES =====
let obstacles = [];
let keys = {};

// ===== INPUT =====
document.addEventListener("keydown", (e) => {

  keys[e.key.toLowerCase()] = true;

  if (!gameStarted && e.code === "Space") {
    gameStarted = true;
  }

  if ((e.code === "Space" || e.key.toLowerCase() === "w") && !player.jumping) {
    player.velocityY = -18;
    player.jumping = true;
  }
});

document.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

// ===== START CLICK =====
canvas.addEventListener("click", (e) => {

  if (!gameStarted) {
    gameStarted = true;
    return;
  }

  if (gameOver) {

    const x = e.clientX;
    const y = e.clientY;

    if (
      x > canvas.width / 2 - 120 &&
      x < canvas.width / 2 + 120 &&
      y > canvas.height / 2 + 20 &&
      y < canvas.height / 2 + 90
    ) {
      location.reload();
    }
  }
});

// ===== OBSTACLES =====
function createObstacle() {

  if (!gameStarted || gameOver) return;

  obstacles.push({
    x: worldOffset + canvas.width + 200,
    y: ground - 40,
    width: 40,
    height: 40
  });
}

setInterval(createObstacle, 1600);

// ===== GAME LOOP =====
function update() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ===== START SCREEN =====
  if (!gameStarted) {

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "60px Arial";
    ctx.textAlign = "center";
    ctx.fillText("SHADOW RUNNER", canvas.width / 2, canvas.height / 2 - 80);

    ctx.font = "30px Arial";
    ctx.fillText("LEVEL STARTEN", canvas.width / 2, canvas.height / 2);

    ctx.font = "20px Arial";
    ctx.fillText("SPACE oder KLICK", canvas.width / 2, canvas.height / 2 + 50);

    requestAnimationFrame(update);
    return;
  }

  // ===== GAME OVER =====
  if (gameOver) {

    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "60px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 80);

    ctx.font = "30px Arial";
    ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 - 20);

    // RESTART BUTTON
    ctx.fillStyle = "red";
    ctx.fillRect(canvas.width / 2 - 120, canvas.height / 2 + 20, 240, 70);

    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("RESTART", canvas.width / 2, canvas.height / 2 + 65);

    return;
  }

  // ===== WORLD MOVE =====
  if (keys["a"]) worldOffset -= player.speed;
  if (keys["d"]) worldOffset += player.speed;

  if (worldOffset < 0) worldOffset = 0;

  // ===== BACKGROUND =====
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ===== GROUND =====
  ctx.fillStyle = "#333";
  ctx.fillRect(0, ground, canvas.width, 120);

  // ===== CASTLE =====
  const castleX = 4000;

  ctx.fillStyle = "gray";
  ctx.fillRect(castleX - worldOffset, ground - 250, 200, 250);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("🏰 BURG", castleX - worldOffset, ground - 260);

  if (worldOffset >= castleX - 50) {
    level = 2;
  }

  // ===== PLAYER PHYSICS =====
  player.y += player.velocityY;
  player.velocityY += 1;

  if (player.y >= ground - 80) {
    player.y = ground - 80;
    player.jumping = false;
  }

  // ===== PLAYER DRAW =====
  ctx.drawImage(playerImg, player.x, player.y, 60, 80);

  // ===== ROCK (FAST) =====
  ctx.beginPath();
  ctx.arc(rock.x, rock.y, rock.radius, 0, Math.PI * 2);
  ctx.fillStyle = "#666";
  ctx.fill();

  rock.x += 1.2 + level * 0.3;

  if (player.x - rock.x < 40) {
    gameOver = true;
  }

  // ===== OBSTACLES =====
  ctx.fillStyle = "red";

  obstacles.forEach((obs, index) => {

    obs.x -= 8;

    ctx.fillRect(obs.x - worldOffset, obs.y, obs.width, obs.height);

    if (
      player.x < (obs.x - worldOffset) + obs.width &&
      player.x + 60 > (obs.x - worldOffset) &&
      player.y < obs.y + obs.height &&
      player.y + 80 > obs.y
    ) {
      gameOver = true;
    }

    if (obs.x < worldOffset - 200) {
      obstacles.splice(index, 1);
      score++;
    }
  });

  // ===== INPUT MOVE =====
  if (keys["a"]) player.x -= player.speed;
  if (keys["d"]) player.x += player.speed;

  if (player.x < 0) player.x = 0;
  if (player.x > canvas.width - 60) player.x = canvas.width - 60;

  // ===== SCORE =====
  ctx.fillStyle = "white";
  ctx.font = "25px Arial";
  ctx.textAlign = "left";
  ctx.fillText("Score: " + score, 20, 40);
  ctx.fillText("Level: " + level, 20, 70);

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
