<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Runner</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #222, #000);
    }

    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      font-size: 22px;
    }
  </style>
</head>

<body>

<div id="info">
  A/D = Bewegen | W oder SPACE = Springen
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// SPIELER
const player = {
  x: 150,
  y: canvas.height - 200,
  width: 50,
  height: 80,
  velocityY: 0,
  speed: 7,
  jumping: false
};

// BODEN
const ground = canvas.height - 120;

// STEIN
const rock = {
  x: 20,
  y: canvas.height - 150,
  radius: 55
};

// SCORE
let score = 0;

// HINDERNISSE
let obstacles = [];

// TASTEN
let keys = {};

// TASTATUR
document.addEventListener("keydown", (e) => {

  keys[e.key.toLowerCase()] = true;

  // Springen
  if (
    (e.code === "Space" || e.key.toLowerCase() === "w")
    && !player.jumping
  ) {
    player.velocityY = -18;
    player.jumping = true;
  }
});

document.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

// HINDERNIS ERSTELLEN
function createObstacle() {

  obstacles.push({
    x: canvas.width,
    y: ground - 40,
    width: 40,
    height: 40
  });
}

// GAME LOOP
function update() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Hintergrund
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Tunnel
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(0, 0, canvas.width, ground);

  // Boden
  ctx.fillStyle = "#333";
  ctx.fillRect(0, ground, canvas.width, 120);

  // Straßenlinien
  ctx.fillStyle = "#555";

  for (let i = 0; i < canvas.width; i += 120) {
    ctx.fillRect(i, ground + 50, 60, 10);
  }

  // SPIELER BEWEGUNG
  if (keys["d"]) {
    player.x += player.speed;
  }

  if (keys["a"]) {
    player.x -= player.speed;
  }

  // Grenzen
  if (player.x < 0) player.x = 0;

  if (player.x > canvas.width - player.width) {
    player.x = canvas.width - player.width;
  }

  // Gravitation
  player.y += player.velocityY;
  player.velocityY += 1;

  // Boden Check
  if (player.y >= ground - player.height) {
    player.y = ground - player.height;
    player.jumping = false;
  }

  // ===== STICKMAN =====

  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;

  // Kopf
  ctx.beginPath();
  ctx.arc(player.x + 25, player.y + 10, 10, 0, Math.PI * 2);
  ctx.stroke();

  // Körper
  ctx.beginPath();
  ctx.moveTo(player.x + 25, player.y + 20);
  ctx.lineTo(player.x + 25, player.y + 50);
  ctx.stroke();

  // Arme
  ctx.beginPath();
  ctx.moveTo(player.x + 10, player.y + 35);
  ctx.lineTo(player.x + 40, player.y + 35);
  ctx.stroke();

  // Beine
  ctx.beginPath();
  ctx.moveTo(player.x + 25, player.y + 50);
  ctx.lineTo(player.x + 10, player.y + 75);

  ctx.moveTo(player.x + 25, player.y + 50);
  ctx.lineTo(player.x + 40, player.y + 75);
  ctx.stroke();

  // ===== STEIN =====

  ctx.beginPath();
  ctx.arc(rock.x, rock.y, rock.radius, 0, Math.PI * 2);
  ctx.fillStyle = "#666";
  ctx.fill();

  // Stein bewegt sich
  rock.x += 0.25;

  // Stein trifft Spieler
  let distance = player.x - rock.x;

  if (distance < 40) {
    alert("💀 Der Stein hat dich erwischt!");
    location.reload();
  }

  // ===== HINDERNISSE =====

  ctx.fillStyle = "red";

  obstacles.forEach((obs, index) => {

    obs.x -= 8;

    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

    // Kollision
    if (
      player.x < obs.x + obs.width &&
      player.x + player.width > obs.x &&
      player.y < obs.y + obs.height &&
      player.y + player.height > obs.y
    ) {
      alert("💀 Game Over! Score: " + score);
      location.reload();
    }

    // Entfernen
    if (obs.x + obs.width < 0) {
      obstacles.splice(index, 1);
      score++;
    }
  });

  // SCORE
  ctx.fillStyle = "white";
  ctx.font = "30px Arial";
  ctx.fillText("Score: " + score, 20, 60);

  requestAnimationFrame(update);
}

// Hindernisse spawnen
setInterval(createObstacle, 2000);

// Start
update();
</script>

</body>
</html>
