<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Runner</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
  }

  canvas {
    display: block;
  }
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ===== GAME STATE =====
let gameOver = false;
let score = 0;
let level = 1;
let worldOffset = 0;

// ===== PLAYER =====
const player = {
  x: 150,
  y: canvas.height - 200,
  velocityY: 0,
  speed: 7,
  jumping: false
};

// ===== WORLD =====
const ground = canvas.height - 120;

// ===== ROCK =====
const rock = {
  x: 0,
  y: canvas.height - 150,
  radius: 55
};

// ===== CASTLE =====
const castleX = 4000;
let inCastle = false;

// ===== OBSTACLES =====
let obstacles = [];
let keys = {};

// ===== INPUT =====
document.addEventListener("keydown", (e) => {

  keys[e.key.toLowerCase()] = true;

  if ((e.code === "Space" || e.key.toLowerCase() === "w") && !player.jumping) {
    player.velocityY = -18;
    player.jumping = true;
  }
});

document.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

// ===== OBSTACLES =====
function createObstacle() {

  if (gameOver) return;

  obstacles.push({
    x: worldOffset + canvas.width + 200,
    y: ground - 40,
    width: 40,
    height: 40
  });
}

setInterval(createObstacle, 1800);

// ===== UPDATE =====
function update() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.8)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "60px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 50);

    ctx.font = "30px Arial";
    ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2);

    return;
  }

  // ===== WORLD MOVE =====
  if (!inCastle) {
    if (keys["d"]) worldOffset += player.speed;
    if (keys["a"]) worldOffset -= player.speed;
  }

  if (worldOffset < 0) worldOffset = 0;

  // ===== LEVEL 1 STYLE =====
  if (level === 1) {
    ctx.fillStyle = "#111";
  } else {
    ctx.fillStyle = "#1b1b1b"; // Castle
  }

  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ===== GROUND =====
  ctx.fillStyle = "#333";
  ctx.fillRect(0, ground, canvas.width, 120);

  // ===== CASTLE =====
  ctx.fillStyle = "gray";
  ctx.fillRect(castleX - worldOffset, ground - 250, 200, 250);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("🏰 BURG", castleX - worldOffset, ground - 260);

  // ENTER CASTLE
  if (worldOffset >= castleX - 50 && level === 1) {
    inCastle = true;
    level = 2;
  }

  // ===== PLAYER PHYSICS =====
  player.y += player.velocityY;
  player.velocityY += 1;

  if (player.y >= ground - 80) {
    player.y = ground - 80;
    player.jumping = false;
  }

  // ===== STICKMAN =====
  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;

  let px = player.x;
  let py = player.y;

  ctx.beginPath();
  ctx.arc(px + 25, py + 10, 10, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(px + 25, py + 20);
  ctx.lineTo(px + 25, py + 50);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(px + 10, py + 35);
  ctx.lineTo(px + 40, py + 35);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(px + 25, py + 50);
  ctx.lineTo(px + 10, py + 75);

  ctx.moveTo(px + 25, py + 50);
  ctx.lineTo(px + 40, py + 75);
  ctx.stroke();

  // ===== ROCK =====
  ctx.beginPath();
  ctx.arc(rock.x, rock.y, rock.radius, 0, Math.PI * 2);
  ctx.fillStyle = "#666";
  ctx.fill();

  rock.x += 0.4;

  if (player.x - rock.x < 40) {
    gameOver = true;
  }

  // ===== OBSTACLES =====
  ctx.fillStyle = "red";

  obstacles.forEach((obs, index) => {

    obs.x -= 8;

    ctx.fillRect(obs.x - worldOffset, obs.y, obs.width, obs.height);

    if (
      player.x < (obs.x - worldOffset) + obs.width &&
      player.x + 50 > (obs.x - worldOffset) &&
      player.y < obs.y + obs.height &&
      player.y + 80 > obs.y
    ) {
      gameOver = true;
    }

    if (obs.x + obs.width < worldOffset - 200) {
      obstacles.splice(index, 1);
      score++;
    }
  });

  // ===== INPUT MOVE =====
  if (keys["a"]) player.x -= player.speed;
  if (keys["d"]) player.x += player.speed;

  if (player.x < 0) player.x = 0;
  if (player.x > canvas.width - 50) player.x = canvas.width - 50;

  // ===== SCORE =====
  ctx.fillStyle = "white";
  ctx.font = "25px Arial";
  ctx.textAlign = "left";
  ctx.fillText("Score: " + score, 20, 40);
  ctx.fillText("Level: " + level, 20, 70);

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
